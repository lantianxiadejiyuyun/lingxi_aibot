# Prebuilt Rust/Vue deployment for fnOS. Import the images before starting.
name: lingxi-v2
services:
  app:
    image: ${LINGXI_IMAGE:-lingxi:2.0.0}
    pull_policy: never
    environment:
      LINGXI_DATA_DIR: /data
      LINGXI_BIND: 0.0.0.0:8000
      LINGXI_ALLOW_PRIVATE_NETWORK: "true"
      LINGXI_FEISHU_EMBEDDED: ${LINGXI_FEISHU_EMBEDDED:-true}
      LINGXI_PUBLIC_URL: ${LINGXI_PUBLIC_URL:-http://${LINGXI_NAS_IP}:${LINGXI_PORT:-18081}}
      LINGXI_NAPCAT_MANAGED: ${LINGXI_NAPCAT_MANAGED:-false}
      LINGXI_NAPCAT_CONFIG_DIR: /run/napcat-config
      LINGXI_NAPCAT_WEBUI_INTERNAL_URL: ${LINGXI_NAPCAT_WEBUI_INTERNAL_URL:-http://napcat:6099}
      LINGXI_NAPCAT_WEBUI_URL: ${LINGXI_NAPCAT_WEBUI_URL:-}
      LINGXI_NAPCAT_HTTP_URL: ${LINGXI_NAPCAT_HTTP_URL:-http://napcat:3000}
      LINGXI_NAPCAT_HTTP_TOKEN: ${LINGXI_NAPCAT_HTTP_TOKEN:-}
      TZ: Asia/Shanghai
      RUST_LOG: lingxi=info,tower_http=info
    ports:
      - "${LINGXI_NAS_IP:?Set the NAS LAN address}:${LINGXI_PORT:-18081}:8000"
      - "127.0.0.1:${LINGXI_PORT:-18081}:8000"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      # Configuration only; the app never needs the QQ login directory.
      - ${LINGXI_NAPCAT_DATA_DIR:-./napcat}/config:/run/napcat-config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:v4.18.37@sha256:f611790ecffa23c3c182017d5cf68179dc24612403608cd835ad13d79642f1bd}
    profiles: [napcat]
    hostname: lingxi-qq
    init: true
    environment:
      TZ: Asia/Shanghai
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
    ports:
      - "${NAPCAT_BIND_IP:-${LINGXI_NAS_IP}}:${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ${LINGXI_NAPCAT_DATA_DIR:-./napcat}/qq:/app/.config/QQ
      - ${LINGXI_NAPCAT_DATA_DIR:-./napcat}/config:/app/napcat/config
      - ${LINGXI_NAPCAT_DATA_DIR:-./napcat}/plugins:/app/napcat/plugins
      - type: bind
        source: ./integrations/napcat-webui-handoff
        target: /app/napcat/static/lingxi-login
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "5", --output, /dev/null, "http://127.0.0.1:6099/webui/"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    ulimits: {core: 0}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  qdrant:
    image: qdrant/qdrant:v1.19.0
    pull_policy: never
    environment:
      QDRANT__SERVICE__API_KEY: ${LINGXI_QDRANT_API_KEY:?Set a vector database key}
    volumes:
      - qq_vectors:/qdrant/storage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qq_vectors:
