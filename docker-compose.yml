# Rust v2: one binary, embedded frontend, local SQLite WAL database.
# Use an explicit file: docker compose -f docker-compose.yml ...
services:
  app:
    build: .
    image: lingxi:2.0.0
    environment:
      LINGXI_DATA_DIR: /data
      LINGXI_BIND: 0.0.0.0:8000
      LINGXI_ALLOW_PRIVATE_NETWORK: ${LINGXI_ALLOW_PRIVATE_NETWORK:-false}
      RUST_LOG: ${RUST_LOG:-lingxi=info,tower_http=info}
    ports:
      - "${LINGXI_BIND_HOST:-127.0.0.1}:${LINGXI_PORT:-8000}:8000"
    volumes:
      - lingxi_rust_data:/data
      # Optional NAS/local media folder; grant it in Settings -> Storage after mounting.
      # - /your/media:/media
    restart: unless-stopped
    stop_grace_period: 45s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  worker:
    image: lingxi:2.0.0
    profiles: [worker]
    command: [worker]
    environment:
      LINGXI_DATA_DIR: /data
      LINGXI_ALLOW_PRIVATE_NETWORK: ${LINGXI_ALLOW_PRIVATE_NETWORK:-false}
    volumes:
      - lingxi_rust_data:/data
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  qdrant:
    image: qdrant/qdrant:v1.19.0
    profiles: [qq]
    volumes:
      - lingxi_qq_vectors:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${LINGXI_QDRANT_API_KEY:-}
    restart: unless-stopped
    # The dedicated vector service is reachable only on this Compose network.
    # In QQ settings use http://qdrant:6333 and enable private service access.

volumes:
  lingxi_rust_data:
  lingxi_qq_vectors:
