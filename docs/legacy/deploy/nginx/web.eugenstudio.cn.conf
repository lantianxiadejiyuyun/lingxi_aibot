# ============================================================
# 灵犀 AI 网页域名 Nginx 配置（宝塔）
# 用途：AI 生成的公开网站从此域名访问（仅路径式：web.eugenstudio.cn/<slug>）
# 用法：宝塔面板 → 网站 → 添加站点（域名 web.eugenstudio.cn）
#      → 站点设置 → 配置文件，用本文件内容替换（或粘贴 server 块）
# ============================================================

# ---- HTTP → HTTPS 跳转 ----
server {
    listen 80;
    server_name web.eugenstudio.cn;

    return 301 https://$host$request_uri;
}

# ---- HTTPS 反代到同一个应用（域名路由在应用内完成）----
server {
    listen 443 ssl;
    server_name web.eugenstudio.cn;

    ssl_certificate     /www/server/panel/vhost/cert/web.eugenstudio.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/web.eugenstudio.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # 静态资源（公开页共用同一套前端资源）
    location /static/ {
        alias /www/wwwroot/aibot/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 60s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
