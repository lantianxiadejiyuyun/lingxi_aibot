; ============================================================
; 灵犀 进程守护（Supervisor）—— 宝塔方案
; 用法（二选一）：
;   A. 宝塔面板 → 软件商店 → 安装「Supervisor管理器」→ 添加守护进程，
;      粘贴本文件的 program 段（命令、目录、日志路径）。
;   B. 系统级 Supervisor（apt install supervisor）：
;      cp aibot.conf /etc/supervisor/conf.d/aibot.conf
;      supervisorctl reread && supervisorctl update && supervisorctl status
; ============================================================

[program:aibot]
; 项目根目录
directory=/www/wwwroot/aibot
; 用项目虚拟环境里的 waitress 启动（单进程多线程，避免重复调度）
command=/www/wwwroot/aibot/venv/bin/waitress-serve --host=127.0.0.1 --port=8000 --threads=8 --channel-timeout=3600 wsgi:app
; 自动启动 / 崩溃自动重启
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
; 日志
stdout_logfile=/www/wwwroot/aibot/logs/app.log
stderr_logfile=/www/wwwroot/aibot/logs/app.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED=1
user=www

; 可选：网页域名守护（如同时需要 http://127.0.0.1:8001 独立进程，一般不需要）
