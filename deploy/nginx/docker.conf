# ============================================================
# 灵犀 AiBot — Docker 方案 Nginx 配置（挂载为 /etc/nginx/conf.d/aibot.conf）
# 默认 80 端口反代（开箱即用）；配好证书后启用下方 443 server 块
# ⚠️ SSE 参数（proxy_buffering off / read_timeout 3600s）必须保留，否则 AI 回答卡住
# ============================================================

# ---- HTTP：两个域名统一反代（应用内按 Host 路由）----
server {
    listen 80;
    server_name admin.eugenstudio.cn web.eugenstudio.cn _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # AI 对话 SSE 流式输出：必须关缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 60s;
    }
}

