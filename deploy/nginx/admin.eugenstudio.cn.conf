# ============================================================
# 灵犀 后台域名 Nginx 配置（宝塔）
# 用法：宝塔面板 → 网站 → 添加站点（域名 admin.eugenstudio.cn）
#      → 站点设置 → 配置文件，用本文件内容替换（或粘贴 server 块）
# 注意：SSL 证书用宝塔「SSL」页一键申请（Let's Encrypt）后，
#       ssl_certificate 路径宝塔会自动生成，本文件为参考写法。
# ============================================================

# ---- HTTP → HTTPS 跳转 ----
server {
    listen 80;
    server_name admin.eugenstudio.cn;

    # 宝塔默认会在这里 include enable-php 等，如无 PHP 可删除
    return 301 https://$host$request_uri;
}

# ---- HTTPS 反代到 waitress (127.0.0.1:8000) ----
server {
    listen 443 ssl;
    server_name admin.eugenstudio.cn;

    # 宝塔申请证书后会自动填充，也可手动指定：
    ssl_certificate     /www/server/panel/vhost/cert/admin.eugenstudio.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/admin.eugenstudio.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传大小（语音、图片）
    client_max_body_size 20m;

    # ---- 静态资源直接由 Nginx 提供，减轻 Python 负担 ----
    location /static/ {
        alias /www/wwwroot/aibot/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 其余全部反代给应用 ----
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # AI 对话是 SSE 流式输出，必须关缓冲 + 长超时，否则回答会卡住不显示
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 60s;
    }

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
