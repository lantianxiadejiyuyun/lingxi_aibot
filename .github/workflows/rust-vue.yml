name: Rust and Vue
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt,clippy
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm test --prefix web
      - run: npm ci --prefix integrations/feishu --ignore-scripts
      - run: npm test --prefix integrations/feishu
      - run: node --test integrations/napcat-webui-handoff/bridge.test.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::await_holding_lock
      - run: cargo test --workspace --locked
      - run: cargo test --locked --test qq_memory real_qdrant -- --ignored
        env:
          LINGXI_TEST_QDRANT_URL: http://127.0.0.1:6333
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/astrbot/requirements.txt
      - run: python -m unittest scripts.tests.test_astrbot_plugin scripts.tests.test_astrbot_v2
      - run: bash -n scripts/deploy.sh
      - run: bash scripts/tests/test_deploy.sh
      - run: docker compose -f docker-compose.yml --profile napcat config --quiet
      - run: docker compose -f docker-compose.fnos.yml --profile napcat config --quiet
        env:
          LINGXI_NAS_IP: 192.0.2.10
          LINGXI_QDRANT_API_KEY: test-only-compose-validation
      - run: docker compose -f docker-compose.yml -f docker-compose.astrbot.yml --profile astrbot config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.ollama.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.feishu.yml config --quiet
        env:
          LINGXI_FEISHU_BRIDGE_TOKEN: test-only-compose-validation
      - run: python scripts/pack_release.py --no-zip
