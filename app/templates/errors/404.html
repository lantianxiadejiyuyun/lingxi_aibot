{% extends 'base.html' %}
{% block title %}404{% endblock %}
{% block page_title %}404 页面不存在{% endblock %}

<div class="card">

    <div style="font-size:48px">🤷</div>
    <h1 style="margin:8px 0">404 页面不存在</h1>

    <p><a href="{{ url_for('auth.login') }}" class="btn btn-primary">去登录</a></p>

</div>
